<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCM Push Test</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 3rem auto; max-width: 42rem; padding: 0 1rem; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input, button, textarea { box-sizing: border-box; font: inherit; margin-top: .35rem; padding: .65rem; width: 100%; }
    button { cursor: pointer; margin-top: 1.25rem; }
    textarea { min-height: 7rem; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Firebase push notification test</h1>
  <p>This page creates a browser FCM token and registers it with your local Notification Service.</p>

  <form id="register-form">
    <label for="user-id">Existing user ID</label>
    <input id="user-id" name="userId" required autocomplete="off">

    <label for="vapid-key">Firebase Web Push certificate key (VAPID public key)</label>
    <input id="vapid-key" name="vapidKey" required autocomplete="off">

    <label for="service-url">Notification Service URL</label>
    <input id="service-url" name="serviceUrl" value="http://localhost:8085" required>

    <button type="submit">Allow notifications and register this browser</button>
    <button id="invalidate-token" type="button">Invalidate this browser's current FCM token</button>
  </form>

  <h2>FCM registration token</h2>
  <textarea id="token" readonly placeholder="The token will appear here after registration."></textarea>
  <p id="status" role="status">Ready.</p>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
