spring.application.name=post-service
spring.config.import=optional:file:./.env[.properties],optional:file:./post-service/.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/post_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.port=8082

aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_S3_SECRET_KEY}
aws.region=${AWS_S3_REGION}
aws.s3.bucket-name=${AWS_BUCKET_NAME}

management.endpoints.web.exposure.include=health, info