spring.application.name=feedback-service

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=feedback-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
# Converts the Kafka message key from raw bytes into a standard Java String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Converts the Kafka message value (payload) from JSON bytes into a Java POJO / DTO using Jackson.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

server.port=8083

user.service.url=http://localhost:8081
feed.max-size=${FEED_MAX_SIZE:100}

management.endpoints.web.exposure.include=health, info